# AI Job Discovery - local stack
#   docker compose up -d --build          start postgres + engine (API + dashboard) + n8n
#   docker compose run --rm n8n-import    import & publish the n8n workflows (first time / after edits)
name: job-discovery

x-n8n-db: &n8n-db
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: jobs
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Kathmandu}
  TZ: ${GENERIC_TIMEZONE:-Asia/Kathmandu}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobs
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 20

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobs:${POSTGRES_PASSWORD}@postgres:5432/jobs
      APP_ROOT: /app
    volumes:
      - ./config:/app/config:ro
      - ./profile:/app/profile:ro
      - ./prompts:/app/prompts:ro
      - ./db:/app/db:ro
      - ./output:/app/output
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8000"   # dashboard: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.38.7
    restart: unless-stopped
    environment:
      <<: *n8n-db
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # workflows read ENGINE_URL / ENGINE_API_TOKEN from env
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"               # plain http on localhost
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      ENGINE_URL: http://engine:8000
      ENGINE_API_TOKEN: ${ENGINE_API_TOKEN:?set ENGINE_API_TOKEN in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_PORT:-5679}:5678"   # n8n editor: http://localhost:5679
    depends_on:
      postgres:
        condition: service_healthy

  n8n-import:
    image: n8nio/n8n:2.38.7
    profiles: ["setup"]
    environment:
      <<: *n8n-db
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (n8n list:workflow | grep -q JobSearchDailyWf || n8n import:workflow --separate --input=/workflows) &&
        n8n publish:workflow --id=JobSearchErrorWf &&
        n8n publish:workflow --id=JobSearchDailyWf
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  n8n_data:
